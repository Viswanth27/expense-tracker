spring.application.name=expense-tracker

# PostgreSQL connection (change these to match your Mac setup)
# You can also set environment variables DB_URL, DB_USER, DB_PASSWORD instead of editing this file
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expensedb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Let Hibernate create/update the EXPENSE table from the Expense class
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
